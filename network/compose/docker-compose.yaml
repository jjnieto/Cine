# docker-compose para red de desarrollo Productoras.
# 1 orderer (Raft 1-nodo), 4 peers (Asociacion + 3 Productoras).
# Volumenes con material crypto generado por cryptogen vía network.sh.

networks:
  productoras:
    name: productoras

volumes:
  orderer.productoras.local:
  peer0.asociacion.productoras.local:
  peer0.productora1.productoras.local:
  peer0.productora2.productoras.local:
  peer0.productora3.productoras.local:

services:
  orderer.productoras.local:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.productoras.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/productoras.local/orderers/orderer.productoras.local/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/productoras.local/orderers/orderer.productoras.local/tls:/var/hyperledger/orderer/tls
      - orderer.productoras.local:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - productoras

  peer0.asociacion.productoras.local:
    extends:
      file: peer-base.yaml
      service: peer-base
    container_name: peer0.asociacion.productoras.local
    environment:
      - CORE_PEER_ID=peer0.asociacion.productoras.local
      - CORE_PEER_ADDRESS=peer0.asociacion.productoras.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.asociacion.productoras.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.asociacion.productoras.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.asociacion.productoras.local:7051
      - CORE_PEER_LOCALMSPID=AsociacionMSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.asociacion.productoras.local:9444
    volumes:
      - ../organizations/peerOrganizations/asociacion.productoras.local/peers/peer0.asociacion.productoras.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/asociacion.productoras.local/peers/peer0.asociacion.productoras.local/tls:/etc/hyperledger/fabric/tls
      - peer0.asociacion.productoras.local:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"

  peer0.productora1.productoras.local:
    extends:
      file: peer-base.yaml
      service: peer-base
    container_name: peer0.productora1.productoras.local
    environment:
      - CORE_PEER_ID=peer0.productora1.productoras.local
      - CORE_PEER_ADDRESS=peer0.productora1.productoras.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.productora1.productoras.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.productora1.productoras.local:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.productora1.productoras.local:8051
      - CORE_PEER_LOCALMSPID=Productora1MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.productora1.productoras.local:9445
    volumes:
      - ../organizations/peerOrganizations/productora1.productoras.local/peers/peer0.productora1.productoras.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/productora1.productoras.local/peers/peer0.productora1.productoras.local/tls:/etc/hyperledger/fabric/tls
      - peer0.productora1.productoras.local:/var/hyperledger/production
    ports:
      - "8051:8051"
      - "9445:9445"

  peer0.productora2.productoras.local:
    extends:
      file: peer-base.yaml
      service: peer-base
    container_name: peer0.productora2.productoras.local
    environment:
      - CORE_PEER_ID=peer0.productora2.productoras.local
      - CORE_PEER_ADDRESS=peer0.productora2.productoras.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.productora2.productoras.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.productora2.productoras.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.productora2.productoras.local:9051
      - CORE_PEER_LOCALMSPID=Productora2MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.productora2.productoras.local:9446
    volumes:
      - ../organizations/peerOrganizations/productora2.productoras.local/peers/peer0.productora2.productoras.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/productora2.productoras.local/peers/peer0.productora2.productoras.local/tls:/etc/hyperledger/fabric/tls
      - peer0.productora2.productoras.local:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9446:9446"

  peer0.productora3.productoras.local:
    extends:
      file: peer-base.yaml
      service: peer-base
    container_name: peer0.productora3.productoras.local
    environment:
      - CORE_PEER_ID=peer0.productora3.productoras.local
      - CORE_PEER_ADDRESS=peer0.productora3.productoras.local:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.productora3.productoras.local:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.productora3.productoras.local:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.productora3.productoras.local:10051
      - CORE_PEER_LOCALMSPID=Productora3MSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.productora3.productoras.local:9447
    volumes:
      - ../organizations/peerOrganizations/productora3.productoras.local/peers/peer0.productora3.productoras.local/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/productora3.productoras.local/peers/peer0.productora3.productoras.local/tls:/etc/hyperledger/fabric/tls
      - peer0.productora3.productoras.local:/var/hyperledger/production
    ports:
      - "10051:10051"
      - "9447:9447"
